[package]
name = "littlebit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI for LittleBit & LittleBit-2 sub-1-bit LLM quantization, QAT distillation, evaluation, generation, packing, and Hub publishing"

[[bin]]
name = "littlebit"
path = "src/main.rs"

[features]
default = []
accelerate = [
    "littlebit-core/accelerate",
    "littlebit-models/accelerate",
    "littlebit-train/accelerate",
    "candle-core/accelerate",
]
metal = [
    "littlebit-core/metal",
    "littlebit-models/metal",
    "littlebit-train/metal",
    "candle-core/metal",
]
cuda = [
    "littlebit-core/cuda",
    "littlebit-models/cuda",
    "littlebit-train/cuda",
    "candle-core/cuda",
]

[dependencies]
littlebit-core.workspace = true
littlebit-models.workspace = true
littlebit-train.workspace = true
anyhow.workspace = true
candle-core.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokenizers.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rand.workspace = true
rand_chacha.workspace = true
tempfile.workspace = true

[lints]
workspace = true
