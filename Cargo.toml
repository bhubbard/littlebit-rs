[workspace]
resolver = "2"
members = [
    "crates/littlebit-core",
    "crates/littlebit-models",
    "crates/littlebit-train",
    "crates/littlebit-cli",
]
default-members = [
    "crates/littlebit-core",
    "crates/littlebit-models",
    "crates/littlebit-train",
    "crates/littlebit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license-file = "LICENSE"
authors = ["Brandon Hubbard <brandon@brandonhubbard.com>"]
repository = "https://github.com/bhubbard/littlebit-rs"

[workspace.dependencies]
littlebit-core = { path = "crates/littlebit-core" }
littlebit-models = { path = "crates/littlebit-models" }
littlebit-train = { path = "crates/littlebit-train" }

candle-core = "0.11.1"
candle-nn = "0.11.1"
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
safetensors = "0.8"
half = "2.5"
hf-hub = { version = "1.0", default-features = false, features = ["blocking", "rustls-tls"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
rayon = "1.11"
regex = "1.11"
sha2 = "0.11"
hex = "0.4"
flate2 = "1.1"
ureq = { version = "3.0", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
